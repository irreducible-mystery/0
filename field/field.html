<title>field of paths</title>
<style>
  :root { --ink: #1c1b19; --paper: #f4f0e8; --warm: #b5482a; --dim: rgba(28, 27, 25, 0.45); }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0 auto; padding: 2.5rem 1.25rem 4rem; max-width: 62rem;

  #weave { display: block; width: 100%; height: auto; }
  #weave path { transition: stroke-opacity 0.6s ease, stroke 0.6s ease, stroke-width 0.6s ease; }
  #weave path.off { stroke-opacity: 0.035; }
  #weave path.one { stroke: var(--warm); stroke-opacity: 1; stroke-width: 2.2; }
  .count { margin: 0.25rem 0 1.5rem; font-size: 0.95rem; color: var(--dim); text-align: center; }
  .taken { margin: 0 auto 1.5rem; max-width: 40rem; padding: 0; list-style: none; font-size: 1.2rem; }
  .taken li { margin: 0 0 0.35rem; }
  .step { margin: 0 auto; max-width: 40rem; }
  .step h2 { font-size: 0.95rem; font-weight: normal; font-style: italic; color: var(--dim); margin: 0 0 0.6rem; }
  .step button.line {
    display: block; width: 100%; margin: 0 0 0.6rem; padding: 0.8rem 1rem; text-align: left;
    font: inherit; font-size: 1.1rem; color: var(--ink); background: transparent;
    border: 1px solid rgba(28, 27, 25, 0.3); border-radius: 3px; cursor: pointer;
  }
  .step button.line:hover, .step button.line:focus-visible { border-color: var(--warm); outline: none; background: rgba(181, 72, 42, 0.06); }
  .end { margin: 0 auto; max-width: 40rem; }
  .end p { margin: 0 0 0.9rem; }
  .end .small { font-size: 0.95rem; color: var(--dim); }
  .end button, .end a { font: inherit; font-size: 0.95rem; color: var(--warm); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .end details { margin-top: 1rem; font-size: 0.95rem; color: var(--dim); }
  .end details li { margin-bottom: 0.2rem; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #weave path { transition: none; } }
</style>

<h1>field of paths</h1>

<script>
(function () {
  var lattice = JSON.parse(document.getElementById('lattice').textContent);
  var layers = lattice.layers;
  var threads = Array.prototype.slice.call(document.querySelectorAll('#weave path[data-p]'));
  var el = function (id) { return document.getElementById(id); };
  var path = '';

  function draw() {
    var left = 0;
    threads.forEach(function (t) {
      var p = t.getAttribute('data-p');
      var live = p.indexOf(path) === 0;
      if (live) left += 1;
      t.classList.toggle('off', !live);
      t.classList.toggle('one', live && path.length === layers.length);
    });
    el('count').textContent = left === 1 ? '1 thread left of 243' : left + ' threads left of 243';

    var taken = el('taken');
    taken.textContent = '';
    path.split('').forEach(function (d, k) {
      var li = document.createElement('li');
      li.textContent = layers[k].lines[Number(d) - 1];
      taken.appendChild(li);
    });

    var done = path.length === layers.length;
    el('step').hidden = done;
    el('end').hidden = !done;
    if (done) {
      el('which').textContent = 'Path ' + path + ', one of 243.';
      el('link').setAttribute('href', '#' + path);
      var passed = el('passed');
      passed.textContent = '';
      layers.forEach(function (layer, k) {
        layer.lines.forEach(function (line, i) {
          if (String(i + 1) === path[k]) return;
          var li = document.createElement('li');
          li.textContent = line;
          passed.appendChild(li);
        });
      });
      return;
    }
    var k = path.length;
    el('role').textContent = (k + 1) + ' of ' + layers.length + ' \u00b7 ' + layers[k].role;
    var choices = el('choices');
    choices.textContent = '';
    layers[k].lines.forEach(function (line, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'line';
      b.textContent = line;
      b.addEventListener('click', function () { path += String(i + 1); draw(); });
      choices.appendChild(b);
    });
  }

  function fromHash() {
    var h = location.hash.replace('#', '');
    path = /^[123]{5}$/.test(h) ? h : '';
    draw();
  }

  el('again').addEventListener('click', function () {
    path = '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    draw();
  });
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
