# The reflex. Wakes on a pull request, on a comment by someone who can write to the repository,
# and on a clock; merges what the rules in dial.yml say merges, closes what has gone stale, then
# consolidates main. A fork's code is not run in this job (tools/reflex.py). The tests of this
# repository's own pull requests are, and they can see the job's environment, so only people who
# can write to the repository may open one. The checkout keeps no credentials on disk.
name: reflex
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number, or "all"
        default: all
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  reflex:
    # a comment on an issue that is not a pull request wakes nothing, and neither does a comment by
    # someone who cannot write to the repository (the schedule still looks at every open pull request)
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: look
        run: |
          case "${{ github.event_name }}" in
            pull_request)  python3 tools/reflex.py pr "${{ github.event.pull_request.number }}" ;;
            issue_comment) python3 tools/reflex.py pr "${{ github.event.issue.number }}" ;;
            workflow_dispatch)
              if [ "${{ github.event.inputs.pr }}" = "all" ]; then python3 tools/reflex.py all;
              else python3 tools/reflex.py pr "${{ github.event.inputs.pr }}"; fi ;;
            *)             python3 tools/reflex.py all ;;
          esac
